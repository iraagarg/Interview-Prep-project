# Render Blueprint for the API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: interviewai-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Same major version as CI, so production runs what the tests ran on
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRE
        value: 7d
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
